<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />

    <!--
      Icons. The masters are Icon Composer's own exports in brand/exports — the real
      thing, gradient and sheen and shadow — and apps/*/public is generated from them with
      `pnpm icons`, never drawn by hand.

      A PNG cannot answer prefers-color-scheme the way an SVG favicon can, so the two
      colourways are two links and the browser picks: the DARK mark on a light tab strip,
      the light one on a dark strip. Safari ignores `media` here and takes the first, which
      is why the dark mark is first — and /favicon.ico is what everything else falls back
      to, dark for the same reason.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-dark-96.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-light-96.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>blooby — animated mascots you can export as Lottie</title>
    <meta name="description" content="Design a circle-and-pill mascot, animate it on a timeline, and export Lottie, dotLottie, GIF, MP4 or a React Native pack. Free, in the browser." />

    <!--
      What a link to blooby unfurls with.

      %VITE_API_URL% is substituted at build time by Vite, so the card is rendered by the
      API with the same renderer as the editor's stage rather than being a PNG in this
      repo that goes stale the day the mascot changes. A SHARED PROJECT gets its own card
      and its own words — the app is a single-page build, so crawlers are sent to
      /og/projects/:id on the API for that (see vercel.json); everybody else gets this.
    -->
    <link rel="canonical" href="https://blooby.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="blooby" />
    <meta property="og:title" content="blooby — animated mascots you can export as Lottie" />
    <meta property="og:description" content="Design a circle-and-pill mascot, animate it on a timeline, and export Lottie, dotLottie, GIF, MP4 or a React Native pack." />
    <meta property="og:image" content="%VITE_API_URL%/og/card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A blooby mascot mid-animation" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="blooby — animated mascots you can export as Lottie" />
    <meta name="twitter:description" content="Design a mascot, animate it on a timeline, export Lottie, GIF and MP4." />
    <meta name="twitter:image" content="%VITE_API_URL%/og/card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
